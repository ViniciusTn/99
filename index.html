<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tela com Mapa</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="phone-screen">
   
    <div class="header" style="display: flex; align-items: center; gap: 8px; padding: 20px 10px 0; box-sizing: border-box; position: absolute; top: 0; left: 0; width: 100%;">
      <button class="back-button" aria-label="Voltar">&larr;</button>
      <div class="address-card">
        <ul class="address-list">
          <li><span class="dot green"></span>Rua Claudio Lopes 984</li>
          <li><span class="dot orange"></span>Rua Araceli 35</li>
        </ul>
        <a href="#" class="alterar-link">Alterar</a>
      </div>
    </div>

    <div class="content-box">
      <div class="ride-offer">
        <h2 class="ride-title">Aproveite a sua corrida com 99</h2>
        <div class="ride-card">
          <div class="ride-info">
            <span class="ride-icon">🚗</span>
            <span class="ride-type">POP</span>
            <span class="ride-seats">4</span>
            <span class="ride-time">5min</span>
          </div>
          <div class="ride-price">R$17,30</div>
        </div>
      </div>
  
      <div class="silent-ride">
        <div class="silent-box">
          <h3>Corrida Silenciada</h3>
          <div class="silent-options">
            <div class="silent-option">
              <input type="checkbox" id="sim">
              <label for="sim">Sim</label>
            </div>
            <div class="silent-option">
              <input type="checkbox" id="nao">
              <label for="nao">Não</label>
            </div>
          </div>
          <p class="silent-description">
            A corrida silenciada da 99 permite que o passageiro não seja perturbado durante a viagem. Caso você selecione a opção "Sim", o motorista será sinalizado.
          </p>
        </div>
      </div>
    </div>
      </div></div>
  </div>
</body>
</html>
